# DAST: OWASP ZAP contra la API en ejecución, guiado por openapi.yaml y AUTENTICADO
# (login + OTP de pruebas), para cubrir los endpoints privados y no solo los públicos.
name: DAST

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # diario
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-api-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Levantar el BFF (imagen de producción, NODE_ENV=development para el OTP de prueba)
        run: |
          docker build -t bff:dast .
          docker run -d --name bff -p 3000:3000 -e NODE_ENV=development bff:dast
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && break; sleep 2; done
      - name: Obtener token de prueba
        id: auth
        run: |
          DEVICE=dast-device-0000000000
          CH=$(curl -s localhost:3000/v1/auth/login -H 'content-type: application/json' \
            -d "{\"documentId\":\"12345678\",\"password\":\"Demo#2026\",\"deviceId\":\"$DEVICE\"}" | jq -r .challengeId)
          TOKEN=$(curl -s localhost:3000/v1/auth/mfa/verify -H 'content-type: application/json' \
            -d "{\"challengeId\":\"$CH\",\"otp\":\"123456\",\"deviceId\":\"$DEVICE\"}" | jq -r .accessToken)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: OWASP ZAP API scan
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm --network host -v "$PWD":/zap/wrk:rw ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t /zap/wrk/openapi.yaml -f openapi -O http://localhost:3000 \
            -c /zap/wrk/.zap/rules.tsv -r reports/zap.html -J reports/zap.json -I \
            -z "-config replacer.full_list(0).description=auth \
                -config replacer.full_list(0).enabled=true \
                -config replacer.full_list(0).matchtype=REQ_HEADER \
                -config replacer.full_list(0).matchstr=Authorization \
                -config replacer.full_list(0).replacement=Bearer\ ${{ steps.auth.outputs.token }} \
                -config replacer.full_list(1).description=device \
                -config replacer.full_list(1).enabled=true \
                -config replacer.full_list(1).matchtype=REQ_HEADER \
                -config replacer.full_list(1).matchstr=X-Device-Id \
                -config replacer.full_list(1).replacement=${{ steps.auth.outputs.device }}"
      - name: Fallar si hay alertas High
        run: |
          HIGH=$(jq '[.site[].alerts[] | select(.riskcode=="3")] | length' reports/zap.json)
          echo "Alertas High: $HIGH"
          test "$HIGH" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: zap-report, path: reports/ }
